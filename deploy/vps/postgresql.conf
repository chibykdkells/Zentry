# PostgreSQL 17 for Zendocx on an 8 GB / 2 vCPU VPS shared with other apps.
# Container memory limit: 1.5 GB (compose.yml). Database is small (~11 MB).
listen_addresses = '*'          # container network only; no port is published
port = 5432
max_connections = 50

shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 96MB
random_page_cost = 1.1          # NVMe
effective_io_concurrency = 200

wal_level = replica             # needed for continuous WAL backups
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 1000   # log anything slower than 1 s
log_line_prefix = '%m [%p] %u@%d '

# Continuous backup: every WAL segment goes to R2 through pgBackRest.
# archive_timeout forces a segment out at least once a minute, so even a quiet
# database never has more than about a minute of changes not yet in R2.
archive_mode = on
archive_command = 'pgbackrest --stanza=zendocx archive-push %p'
archive_timeout = 60
